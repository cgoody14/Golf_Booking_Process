# Copy to config.yaml and edit.
club:
  # From the club URL: https://www.chronogolf.com/club/<slug>
  slug: "country-club-of-billerica"
  # Course UUID (course_ids=... in the /marketplace/v2/teetimes request)
  course_uuid: "bcad5a1d-e640-449c-9891-a0db426e3204"

booking:
  date: "2026-10-06"         # YYYY-MM-DD
  earliest: "07:00"          # 24h, course local time
  latest: "10:00"
  players: 2
  holes: 18
  # true = stop before the final confirm click
  dry_run: true

release:
  # If tee times drop at a fixed time, the bot waits and then polls.
  # Leave at null to search immediately.
  at: null                   # e.g. "2026-10-03T07:00:00"
  timezone: "America/New_York"
  poll_seconds: 2
  give_up_after_seconds: 300

browser:
  profile_dir: ".browser-profile"
